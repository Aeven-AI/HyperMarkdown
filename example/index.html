<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperMarkdown — streaming example</title>

    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="preload"
      href="./assets/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/geist-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/KaTeX_Main-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/KaTeX_Math-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/KaTeX_Size1-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/KaTeX_Size2-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/KaTeX_Size3-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="modulepreload"
      href="https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs"
      crossorigin
    />

    <!--
      The component's own stylesheet. Nothing else styles the messages: if a
      table, code block or diagram looks right here, it looks right anywhere
      the package is installed.
    -->
    <link rel="stylesheet" href="../dist/hypermarkdown.css" />

    <!--
      KaTeX ships its own stylesheet and the maths plugin does not inline it,
      so a host using that plugin has to load it. From a CSS CDN rather than
      esm.sh, which serves .css with a MIME type browsers refuse for a
      stylesheet.
    -->
    <link
      rel="stylesheet"
      href="./katex.css"
    />

    <link rel="stylesheet" href="./example.css" />

    <!--
      The built bundle leaves its dependencies external, so they are resolved
      here rather than bundled. React is pinned once and everything that needs
      it is pointed at that pin, so there is only ever one copy.
    -->
    <script type="importmap">
      {
            "imports": {
                  "react": "https://esm.sh/react@19.2.8",
                  "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime",
                  "react-dom": "https://esm.sh/react-dom@19.2.8?deps=react@19.2.8,react-dom@19.2.8",
                  "react-dom/client": "https://esm.sh/react-dom@19.2.8/client?deps=react@19.2.8,react-dom@19.2.8",
                  "hast-util-to-jsx-runtime": "https://esm.sh/hast-util-to-jsx-runtime@2.3.6?deps=react@19.2.8,react-dom@19.2.8",
                  "mermaid": "https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs",
                  "rehype-highlight": "https://esm.sh/rehype-highlight@7.0.2",
                  "rehype-katex": "https://esm.sh/rehype-katex@7.0.1",
                  "rehype-raw": "https://esm.sh/rehype-raw@7.0.0",
                  "rehype-react": "https://esm.sh/rehype-react@8.0.0?deps=react@19.2.8,react-dom@19.2.8",
                  "rehype-sanitize": "https://esm.sh/rehype-sanitize@6.0.0",
                  "remark-cjk-friendly": "https://esm.sh/remark-cjk-friendly@2.3.1",
                  "remark-gfm": "https://esm.sh/remark-gfm@4.0.1",
                  "remark-math": "https://esm.sh/remark-math@6.0.0",
                  "remark-parse": "https://esm.sh/remark-parse@11.0.0",
                  "remark-rehype": "https://esm.sh/remark-rehype@11.1.2",
                  "tippy.js": "https://esm.sh/tippy.js@6.3.7",
                  "unified": "https://esm.sh/unified@11.0.5",
                  "unist-util-visit": "https://esm.sh/unist-util-visit@5.1.0",
                  "hypermarkdown": "../dist/hypermarkdown.js",
                  "hypermarkdown/plugins/math": "../dist/plugins/math.js",
                  "hypermarkdown/plugins/code": "../dist/plugins/code.js",
                  "hypermarkdown/plugins/mermaid": "../dist/plugins/mermaid.js",
                  "hypermarkdown/plugins/cjk": "../dist/plugins/cjk.js"
            }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./example.js?v=18"></script>
  </body>
</html>
