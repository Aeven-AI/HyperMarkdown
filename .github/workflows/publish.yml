# Publishes @aeven-ai/hypermarkdown to npm. Run by hand, never on a release.
#
# The account publishes under two-factor auth held in a keystore, which no
# runner can satisfy, so releasing is a local `npm publish`. This ran on every
# published release until v0.2.1, where it failed for want of a credential it
# was never going to have — turning each release red for a step that could not
# succeed. It stays here, on demand, for the day trusted publishing is set up.
#
# To make it automatic again, add the `release: types: [published]` trigger back
# and complete the one-time setup on npmjs.com → package → Settings → Trusted
# Publisher:
#   Organization or user: Aeven-AI
#   Repository:           HyperMarkdown
#   Workflow filename:    publish.yml
#   Environment name:     npm
#   Allowed actions:      npm publish
#
# GitHub → Settings → Environments → create `npm` (optional approval reviewers).
# No NPM_TOKEN is required. Provenance is generated automatically.

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write

  publish:
    name: Publish to npm
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aeven-ai/hypermarkdown
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Do not set registry-url. setup-node writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, which makes npm
      # skip OIDC trusted publishing and fail with E404 or ENEEDAUTH.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Node 22 may ship an older CLI.
      - name: Use npm 11
        run: npm install -g npm@^11.5.1

      - name: Match package version to release tag
        if: github.event_name == 'release'
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version $pkg does not match release tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

          echo "node $(node --version) npm $(npm --version)"
          pkg=$(node -p "require('./package.json').version")
          if npm view "@aeven-ai/hypermarkdown@$pkg" version >/dev/null 2>&1; then
            echo "@aeven-ai/hypermarkdown@$pkg is already on npm; skipping publish"
            exit 0
          fi

          # OIDC is the whole credential: no token is configured anywhere, so
          # without it npm has nothing to authenticate with.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC is unavailable. This job needs permissions.id-token: write."
            exit 1
          fi

          # npm does the trusted-publishing exchange itself, from these same
          # ACTIONS_ID_TOKEN_* variables. This step used to run that exchange by
          # hand first and throw the resulting token away, publishing without
          # it — so the call proved nothing about the publish, but its failure
          # still blocked one. It is npm's own endpoint to call, and its errors
          # are the ones worth reading.
          npm publish --access public --loglevel verbose
