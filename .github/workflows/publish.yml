# Publishes @aeven-ai/hypermarkdown to npm when a GitHub Release is published.
#
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   Organization or user: Aeven-AI
#   Repository:           HyperMarkdown
#   Workflow filename:    publish.yml
#   Environment name:     npm
#   Allowed actions:      npm publish
#
# GitHub → Settings → Environments → create `npm` (optional approval reviewers).
# No NPM_TOKEN is required. Provenance is generated automatically.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write

  publish:
    name: Publish to npm
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aeven-ai/hypermarkdown
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Do not set registry-url. setup-node writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, which makes npm
      # skip OIDC trusted publishing and fail with E404 or ENEEDAUTH.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Node 22 may ship an older CLI.
      - name: Use npm 11
        run: npm install -g npm@^11.5.1

      - name: Match package version to release tag
        if: github.event_name == 'release'
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version $pkg does not match release tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

          echo "node $(node --version) npm $(npm --version)"
          pkg=$(node -p "require('./package.json').version")
          if npm view "@aeven-ai/hypermarkdown@$pkg" version >/dev/null 2>&1; then
            echo "@aeven-ai/hypermarkdown@$pkg is already on npm; skipping publish"
            exit 0
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC is unavailable. This job needs permissions.id-token: write."
            exit 1
          fi

          audience='npm:registry.npmjs.org'
          id_token=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | jq -r '.value // empty')
          if [ -z "$id_token" ]; then
            echo "::error::GitHub did not issue an OIDC token for audience ${audience}."
            exit 1
          fi

          http_code=$(curl -sS -o /tmp/npm-oidc.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${id_token}" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@aeven-ai%2fhypermarkdown")
          echo "npm OIDC token exchange HTTP ${http_code}"
          jq 'del(.token)' /tmp/npm-oidc.json 2>/dev/null || head -c 500 /tmp/npm-oidc.json
          if [ "$http_code" != "201" ] && [ "$http_code" != "200" ]; then
            echo "::error::npm trusted publisher exchange failed (HTTP ${http_code}). On npmjs.com → @aeven-ai/hypermarkdown → Settings → Trusted Publisher, set Organization=Aeven-AI, Repository=HyperMarkdown, Workflow filename=publish.yml, Environment name=npm, Allowed actions=npm publish. The environment name is required and must match this job."
            exit 1
          fi

          npm publish --access public --loglevel verbose
